# Render Blueprint: das Spiel als statische Seite (kein Server, nichts zu bauen).
# Cache-Control „no-cache“: Browser fragen bei jedem Laden nach, ob sich eine Datei geändert hat
# (per ETag, unverändert kommt nur eine kurze Antwort) – nach einem Deploy sind alle Module sofort aktuell.
services:
  - type: web
    name: pot-black
    runtime: static
    buildCommand: echo "kein Build nötig"
    staticPublishPath: .
    autoDeploy: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
